<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dieter-rams scaffolding preview</title>
<link rel="stylesheet" href="../src/tokens.css">
<link rel="stylesheet" href="../src/themes/light.css">
<link rel="stylesheet" href="../src/themes/night.css">
<link rel="stylesheet" href="../src/themes/savee.css">
<link rel="stylesheet" href="../src/atoms.css">
<link rel="stylesheet" href="../src/clusters.css">
<style>
  body { margin:0; background:#888; font-family:var(--rm-font); }
  .bar { display:flex; gap:16px; flex-wrap:wrap; padding:10px 16px; background:#222; color:#ddd; font:12px var(--rm-font); position:sticky; top:0; z-index:5 }
  .bar label { display:flex; gap:6px; align-items:center }
  .stage { display:flex; flex-wrap:wrap; gap:16px; padding:16px; }
  .page { background:var(--rm-housing); padding:14px; border-radius:8px; box-sizing:content-box; position:relative; }
  .cap { font:11px var(--rm-font); color:#eee; margin:0 0 6px }
  .gridov { position:absolute; inset:14px; display:none; grid-template-columns:repeat(12,1fr); gap:var(--rm-gap); pointer-events:none; z-index:3 }
  .gridov i { background:rgba(255,0,80,.12); outline:1px solid rgba(255,0,80,.35) }
  .show-grid .gridov { display:grid }
</style></head>
<body data-theme="light">
<div class="bar">
  <label>theme <select id="theme"><option>light</option><option>night</option><option>savee</option></select></label>
  <label>section width <select id="w"><option>320</option><option selected>376</option><option>420</option><option>520</option></select> px</label>
  <label><input type="checkbox" id="grid"> show 12-column grid</label>
</div>
<div class="stage" id="stage"></div>
<script>
const $ = (s,e=document)=>e.querySelector(s);
const cs = (c,r)=>`style="--c:${c};--r:${r}"`;
const key  = (t,c=3,o={})=>`<div class="rm-key" ${cs(c,1)} ${o.tone?`data-tone="${o.tone}"`:''} ${o.state?`data-state="${o.state}"`:''}>${t}</div>`;
const rnd  = (g,o={})=>`<div class="rm-round ${o.text?'is-text':''}" ${cs(2,1)} ${o.tone?`data-tone="${o.tone}"`:''} ${o.label?`data-label="${o.label}"`:''} ${o.state?`data-state="${o.state}"`:''}>${o.label?`<span>${o.label}</span>`:''}<div class="rm-round__cap">${g}</div></div>`;
const lcd  = (h,c=12,o={})=>`<div class="rm-lcd" ${cs(c,1)} ${o.big?'data-big':''} ${o.ok?'data-ok':''} ${o.alert?'data-alert':''}>${h}</div>`;
const ruler= (v,t)=>`<div class="rm-ruler" style="--v:${v}${t!=null?`;--t:${t}`:''}" ${t!=null?'data-target':''}></div>`;
const art  = (svg,c,r,cap,pl)=>`<div class="rm-art" ${cs(c,r)} ${pl?'data-playing':''}>${svg}${cap?`<span class="rm-art__cap">${cap}</span>`:''}</div>`;
const sv   = (inner)=>`<svg viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice">${inner}</svg>`;
const covers = {
 a: sv('<rect width="120" height="120" fill="#3B4B59"/><circle cx="60" cy="60" r="34" fill="#ED8008"/><rect y="84" width="120" height="36" fill="#261201"/>'),
 b: sv('<rect width="120" height="120" fill="#261201"/><rect x="18" y="14" width="14" height="92" fill="#BF7C2A"/><rect x="42" y="14" width="14" height="92" fill="#C09C6F"/><rect x="66" y="14" width="14" height="92" fill="#BF7C2A"/><rect x="90" y="14" width="14" height="92" fill="#9C9C9C"/>'),
 c: sv('<rect width="120" height="120" fill="#D9C3B0"/><path d="M0 120A60 60 0 0 1 120 120Z" fill="#AF2E1B"/><circle cx="60" cy="40" r="14" fill="#3B4B59"/>'),
 d: sv('<rect width="120" height="120" fill="#736B1E"/><circle cx="40" cy="60" r="28" fill="#D9D2C6"/><circle cx="80" cy="60" r="28" fill="#ED3F1C"/>'),
 e: sv('<rect width="120" height="120" fill="#AAB7BF"/><path d="M0 120L60 0H90L30 120Z" fill="#5F503E"/><path d="M60 120L120 0V40L90 120Z" fill="#E1E4E1"/>'),
 f: sv('<rect width="120" height="120" fill="#ED3F1C"/><rect x="30" y="30" width="60" height="60" fill="#D9D2C6"/><rect x="30" y="60" width="60" height="30" fill="#BF1B1B"/>'),
 np:sv('<rect width="120" height="120" fill="#3B4B59"/><circle cx="60" cy="60" r="46" fill="#BF7C2A"/><circle cx="60" cy="60" r="30" fill="#3B4B59"/><circle cx="60" cy="60" r="14" fill="#ED8008"/><rect y="100" width="120" height="20" fill="#261201"/>')
};
const tile = (label,val,unit,side,rows,rl,foot)=>`<div class="rm-tile" ${cs(12,rows)} data-rows="${rows}"><div class="rm-tile__label">${label}</div><div class="rm-tile__value">${val}<small>${unit}</small></div><div class="rm-tile__side">${side||''}</div>${rl||''}${foot?`<div class="rm-tile__foot">${foot}</div>`:''}</div>`;
const cluster=(r,inner)=>`<div class="rm-cluster" style="--r:${r}">${inner}</div>`;

const climate = cluster(6,
  tile('kitchen · temperature','21.4','°C','<span>humidity</span><br>48 %<br><span>co₂</span><br>612 ppm',3,ruler(.58,.5),'<span>16</span><span>target 21.0</span><span>26</span>')+
  lcd('<span class="rm-dot"></span>close the velux: it is 2 °C warmer outside',12,{ok:1})+
  rnd('−')+lcd('21.0<small>°C target</small>',8,{big:1})+rnd('+',{tone:'active'})+
  key('door',4,{state:'on'})+key('window',4)+key('velux',4,{state:'on'}));
const light = cluster(5,
  tile('living room · main light','64','%','',2,ruler(.64))+
  rnd('−')+key('25',2)+key('50',2)+key('75',2,{state:'on'})+key('100',2)+rnd('+',{tone:'active'})+
  key('bright',3)+key('cosy',3,{state:'on'})+key('dark',3)+key('all off',3,{tone:'dark'})+
  rnd('on',{label:'on',tone:'active',text:1}).replace('rm-round__cap">on','rm-round__cap">●')+rnd('▭',{label:'read'})+rnd('▭',{label:'tv'})+rnd('▭',{label:'dine'})+rnd('▭',{label:'night'})+rnd('■',{label:'off',tone:'dark'}));
const transport = cluster(5,
  art(covers.np,6,3,'',1)+
  `<div class="rm-tile" ${cs(6,3)}><div class="rm-tile__label">now playing · kitchen</div><div style="grid-column:1/3;font-size:16px;line-height:1.25;align-self:center">Kind of Blue<br><span style="font-size:12px;color:var(--rm-muted)">Miles Davis<br>So What</span></div><div class="rm-tile__foot">1:42<span>9:22</span></div></div>`+
  rnd('⏮')+rnd('⏸',{tone:'active'})+rnd('⏭')+rnd('■',{tone:'dark'})+rnd('⇄',{label:'shuffle'})+rnd('↻',{label:'repeat'})+
  rnd('−')+`<div class="rm-tile" ${cs(8,1)} style="--c:8;--r:1;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 10px"><span class="rm-tile__label">volume · 35 %</span>${ruler(.35)}</div>`+rnd('+',{tone:'active'}));
const radio = cluster(4,
  art(covers.a,4,2,'radio 3',1)+art(covers.b,4,2,'jazz fm')+art(covers.c,4,2,'klassik')+
  art(covers.d,4,2,'nova')+art(covers.e,4,2,'kcrw')+art(covers.f,4,2,'rne'));
const alarm = cluster(7,
  `<div class="rm-tile" ${cs(12,2)}><div class="rm-tile__label">alarm · house</div><div class="rm-tile__value" style="font-size:26px;display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;background:var(--rm-active)"></span>armed home</div></div>`+
  lcd('<span class="rm-dot"></span>●●○○ <small>enter code</small>',12)+
  rnd('1')+rnd('2')+rnd('3')+key('disarm',6,{state:'on'})+
  rnd('4')+rnd('5')+rnd('6')+key('arm home',6)+
  rnd('7')+rnd('8')+rnd('9')+key('arm away',6,{tone:'alert'})+
  rnd('clr',{tone:'dark',text:1})+rnd('0')+rnd('ok',{tone:'active',text:1})+key('night mode',6,{tone:'dark'}));
const dialSvg = `<svg viewBox="0 0 120 120"><circle class="dots" cx="60" cy="60" r="50" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 26.18" transform="rotate(-90 60 60)"/><line class="hand" id="hh" x1="60" y1="60" x2="60" y2="38" stroke-width="6"/><line class="hand" id="hm" x1="60" y1="60" x2="60" y2="22" stroke-width="5"/><line class="sec" id="hs" x1="60" y1="60" x2="60" y2="106" stroke-width="1.5"/><circle class="hub" cx="60" cy="60" r="6"/></svg>`;
const clock = cluster(4,
  `<div class="rm-dial" ${cs(6,3)}><div class="rm-dial__key"></div>${dialSvg}</div>`+
  `<div class="rm-lcd" ${cs(6,1)} data-big id="digi">10:08</div>`+
  `<div class="rm-lcd" ${cs(6,2)} style="align-items:flex-start;padding-top:8px;flex-direction:column;gap:2px"><small>friday</small><span>13 nov 2026</span><small style="margin-top:auto">alarm 07:00</small></div>`+
  key('alarm',3,{state:'on'})+key('snooze',3)+key('light',3)+key('sleep',3,{tone:'dark'}));

const pages = [
 ['climate + light', climate+light],
 ['music', transport+radio],
 ['alarm', alarm],
 ['clock + lcd text', clock],
];
const stage = $('#stage');
function render(){
  const w = +$('#w').value;
  stage.innerHTML = pages.map(([n,h])=>`<div><p class="cap">${n}</p><div class="page" style="width:${w}px"><div class="gridov">${'<i></i>'.repeat(12)}</div><div class="rm-section">${h}</div></div></div>`).join('');
}
$('#theme').onchange = e=>document.body.dataset.theme = e.target.value;
$('#w').onchange = ()=>{render();tick();};
$('#grid').onchange = e=>document.body.classList.toggle('show-grid', e.target.checked);
render();
function tick(){const d=new Date(),s=d.getSeconds(),m=d.getMinutes()+s/60,h=(d.getHours()%12)+m/60;
 document.querySelectorAll('#hh').forEach(e=>e.style.transform=`rotate(${h*30}deg)`);
 document.querySelectorAll('#hm').forEach(e=>e.style.transform=`rotate(${m*6}deg)`);
 document.querySelectorAll('#hs').forEach(e=>e.style.transform=`rotate(${s*6}deg)`);
 document.querySelectorAll('#digi').forEach(e=>e.textContent=d.toTimeString().slice(0,5));}
setInterval(tick,1000);tick();
</script></body></html>
