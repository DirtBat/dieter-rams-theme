# Dieter Rams: day (light mode) and night (dark mode) in one theme.
# Copy this file to /config/themes/ and reload themes. Choose "Dieter Rams" in your profile;
# light/dark follows your Dark mode setting (Auto, Light or Dark) or the frontend.set_theme action.
# Only rams-* variables are set here: the cards fall back to the day values when no theme is chosen.
Dieter Rams:
  modes:
    light:
      rams-plate: "#f5f4f0"
      primary-background-color: "#ffffff"   # the page: white by day
      rams-cap: "#e6e3da"             # keys are beige-grey, so they do not vanish on a white page
      rams-field: "#eae9e3"
      rams-ink: "#261201"
      rams-ink-on: "#ffffff"
      rams-muted: "#736356"
      rams-down: "#cfcbc1"            # a key that is down: darker than the cap, lighter than the shadow
      rams-key-edge: "rgba(38, 18, 1, 0.35)"
      rams-lens: "#b9b3a6"            # warning LED, unlit
      rams-slot: "#2b2118"            # selector slot
      rams-graphite: "#34312d"        # wide keys
      rams-graphite-down: "#272421"   # a wide key that is down
      rams-backlit-bg: "linear-gradient(180deg, #98a090 0%, #8b9385 55%, #7d8578 100%)"   # frame: backlit, the same by day and night
      rams-backlit-ink: "#12160f"
      rams-led-bg: "linear-gradient(180deg, #0a0b08 0%, #12140e 100%)"   # black display
      rams-led-ink: "#c6e63c"         # ... its yellow-green lights
      rams-lever: "#efece4"
      rams-red: "#c8362b"
      rams-orange: "#e8801a"
      rams-blue: "#2f5fa8"
      rams-green: "#3e8e5a"
      rams-grey: "#8a8a86"
      rams-border: "1px solid rgba(38, 18, 1, 0.18)"
      rams-raised: "0 2px 3px rgba(38, 18, 1, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.8)"
      rams-pressed: "inset 0 2px 3px rgba(38, 18, 1, 0.25)"
      rams-inset: "inset 0 2px 3px rgba(38, 18, 1, 0.12)"
      # Night roles, off by day
      rams-glow: "0px"
      rams-cap-rest: "100%"           # how much of its colour a full-colour key shows at rest
      rams-cap-on: "78%"              # ... and when active (mixed with the next value)
      rams-cap-on-mix: "#000000"
      # LCD (recessed display and dial): green, reflective
      rams-lcd-bg: "linear-gradient(180deg, #d6dac9 0%, #cbd0bd 100%)"
      rams-lcd-ink: "#2b3026"
    dark:
      primary-background-color: "#0b0b0a"   # the page: black by night
      rams-plate: "#1c1b19"
      rams-cap: "#2a2825"
      rams-field: "#141311"
      rams-ink: "#ece6d9"
      rams-ink-on: "#fff6e8"
      rams-muted: "#9b9285"
      rams-down: "#4d463a"            # a key that is down is lit
      rams-key-edge: "rgba(0, 0, 0, 0.7)"
      rams-ring: "#0b0b0a"
      rams-lens: "#3a1512"
      rams-slot: "#0e0d0c"
      rams-graphite: "#4a4741"
      rams-graphite-down: "#6b665c"   # lit, like the other keys
      rams-led-bg: "linear-gradient(180deg, #060705 0%, #0d0f0a 100%)"
      rams-led-ink: "#c6e63c"
      rams-lever: "#8d887c"
      rams-red: "#e0483a"
      rams-orange: "#f09a2e"
      rams-blue: "#5c8fe0"
      rams-green: "#52b576"
      rams-grey: "#8f8d86"
      rams-border: "1px solid rgba(255, 235, 200, 0.10)"
      rams-raised: "inset 0 1px 0 rgba(255, 235, 200, 0.07)"      # no drop shadows in the dark
      rams-pressed: "inset 0 0 0 1px rgba(0, 0, 0, 0.35)"
      rams-inset: "inset 0 0 0 1px rgba(0, 0, 0, 0.45)"
      # Night roles: stripes become LEDs, full-colour keys are backlit, glow reaches beyond the key
      rams-glow: "10px"
      rams-cap-rest: "42%"
      rams-cap-on: "100%"
      rams-cap-on-mix: "#ffffff"
      # LCD: a dim grey with a hint of green, backlit; dark ink (the iPod's screen, at night)
      rams-lcd-bg: "linear-gradient(180deg, #98a090 0%, #8b9385 55%, #7d8578 100%)"
      rams-lcd-ink: "#12160f"
